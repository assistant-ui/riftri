[workspace]
members = [
    "crates/riftri-cli",
    "crates/riftri-core",
    "crates/riftri-git",
    "crates/riftri-storage",
]
resolver = "2"

[workspace.package]
version = "0.3.5"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Assistant UI contributors"]
repository = "https://github.com/assistant-ui/riftri"
homepage = "https://github.com/assistant-ui/riftri"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.3"
crossterm = "0.29"
fs2 = "0.4"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.23"
thiserror = "2.0"
unicode-width = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }

[profile.release]
strip = true
