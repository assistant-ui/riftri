name: Website deploy

# Deploys are manual: riftri.dev is published from a maintainer workstation and
# this repository holds no VERCEL_* secrets. Running on every push to main
# could therefore only ever fail, so this stays dispatch-only. Add the three
# secrets and it works unchanged from the Actions tab, or on a push trigger
# restored here.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race: the newer commit must win, and an in-flight
# deploy of an older commit would otherwise publish stale content last.
concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy riftri.dev
    runs-on: ubuntu-24.04

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require deployment credentials
        run: |
          set -euo pipefail
          # Deploying needs all three values. Fail loudly when they are absent
          # rather than skipping every step and still reporting success: a
          # green "deploy" run that deployed nothing is exactly what let the
          # unbranded 404 reach production unnoticed (#377). Someone who
          # dispatches this run means to deploy, so missing secrets are an
          # error worth showing rather than a reason to report success.
          missing=""
          [ -n "${VERCEL_TOKEN}" ] || missing="${missing} VERCEL_TOKEN"
          [ -n "${VERCEL_ORG_ID}" ] || missing="${missing} VERCEL_ORG_ID"
          [ -n "${VERCEL_PROJECT_ID}" ] || missing="${missing} VERCEL_PROJECT_ID"
          if [ -n "${missing}" ]; then
            echo "::error::Cannot deploy riftri.dev: missing secret(s)${missing}. Add them to the repository, or deploy from a workstation with the Vercel CLI."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.18.3 --activate

      - name: Install website dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Check website types
        run: pnpm --dir website type-check

      - name: Build website
        # Stages the installers, builds, and finalizes the Vercel Build Output
        # API directory, including the build-info.json revision the deployment
        # is verified against below.
        run: pnpm --dir website build

      - name: Deploy the prebuilt output to production
        working-directory: website
        # The CLI is not a project dependency, so it is fetched here at a
        # pinned version rather than pulled into every install of the website.
        run: npx --yes vercel@59.20.0 deploy --prebuilt --prod --yes --token "${VERCEL_TOKEN}"

      - name: Verify the public production deployment
        # Confirms riftri.dev now serves this exact commit, that the installers
        # and Markdown guide match the repository, and that the homepage keeps
        # its canonical and sharing metadata.
        run: node package/scripts/verify-website.mjs https://riftri.dev
