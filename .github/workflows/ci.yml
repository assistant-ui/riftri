name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job below sets `timeout-minutes`. Without it a hung step blocks the
# pull request until GitHub's six-hour default expires and produces no
# diagnostic at all: `npm test` on ubuntu has stalled this way, and the
# cancel-and-rerun habit it encourages destroys the evidence each time
# (#399). The slowest job here runs about five minutes, so 30 surfaces a
# stall while leaving ample room for a slow runner.
jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust quality components
        run: rustup component add clippy rustfmt

      - name: Install npm metadata only
        run: npm ci --ignore-scripts --omit=optional

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests (tui feature)
        run: cargo test --workspace --locked --features riftri-cli/tui

      # The tui feature deselects crates/riftri-cli/src/ui/plain.rs, so the
      # default/plain build shipped by `cargo install riftri-cli` and
      # `npm run build:native` is never test-executed by the run above. Exercise
      # it explicitly on one runner so plain.rs and the non-interactive setup
      # fallback stay covered.
      - name: Run Rust tests (default/plain features)
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test --workspace --locked

      - name: Create disposable APFS benchmark volume
        if: matrix.os == 'macos-15'
        run: |
          hdiutil create -size 1g -fs APFS -volname RiftriBenchmark \
            -type SPARSEBUNDLE "$RUNNER_TEMP/riftri-benchmark"
          mkdir "$RUNNER_TEMP/riftri-apfs"
          hdiutil attach "$RUNNER_TEMP/riftri-benchmark.sparsebundle" \
            -mountpoint "$RUNNER_TEMP/riftri-apfs" -nobrowse

      - name: Record native COW benchmark
        if: matrix.os == 'macos-15'
        env:
          RIFTRI_BENCHMARK_OUTPUT: ${{ runner.temp }}/riftri-native-cow-macos.json
          TMPDIR: ${{ runner.temp }}/riftri-apfs
        run: >-
          cargo test -p riftri-core --test native_cow_benchmark
          reports_cold_cached_and_private_write_costs
          -- --ignored --exact --nocapture

      - name: Record sparse monorepo benchmark
        if: matrix.os == 'macos-15'
        env:
          RIFTRI_SPARSE_BENCHMARK_OUTPUT: ${{ runner.temp }}/riftri-sparse-monorepo-macos.json
          TMPDIR: ${{ runner.temp }}/riftri-apfs
        run: >-
          cargo test -p riftri-core --test native_cow_benchmark
          reports_sparse_cone_costs_on_a_monorepo_shape
          -- --ignored --exact --nocapture

      - name: Upload sparse monorepo benchmark
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparse-monorepo-benchmark-macos-apfs
          path: ${{ runner.temp }}/riftri-sparse-monorepo-macos.json
          if-no-files-found: error

      - name: Upload native COW benchmark
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cow-benchmark-macos-apfs
          path: ${{ runner.temp }}/riftri-native-cow-macos.json
          if-no-files-found: error

      - name: Detach disposable APFS benchmark volume
        if: always() && matrix.os == 'macos-15'
        run: |
          if mount | grep -q "on $RUNNER_TEMP/riftri-apfs "; then
            hdiutil detach "$RUNNER_TEMP/riftri-apfs"
          fi

      - name: Run npm launcher tests
        run: npm test

      - name: Inspect npm package contents
        run: npm run pack:check

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.88 --profile minimal --no-self-update

      - name: Check the workspace on the declared rust-version
        run: cargo +1.88 check --workspace --all-targets --locked

  coverage:
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust coverage components
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-llvm-cov

      - name: Install npm metadata only
        run: npm ci --ignore-scripts --omit=optional

      - name: Measure workspace test coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Summarize coverage
        run: |
          {
            echo '## Coverage summary'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
            echo
            echo 'Scope: unit and integration tests that run on this Linux runner,'
            echo 'without `riftri-core/native-cow-integration`. It therefore excludes'
            echo 'the APFS, ReFS, Btrfs, XFS, and OverlayFS lifecycle suites that run'
            echo 'in the native-backend jobs, and it cannot execute code behind'
            echo '`cfg(target_os = "macos")` or `cfg(target_os = "windows")`.'
            echo 'Treat it as a trend for portable code, not as total tested coverage.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

      # No-op until a maintainer adds the CODECOV_TOKEN repository secret;
      # the step is skipped whenever the token is absent (for example on
      # forks), so coverage never blocks contributors without the secret.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true

  website:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.18.3 --activate

      - name: Install website dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Audit deployed website dependencies
        run: pnpm --dir website audit --prod

      - name: Check website types
        run: pnpm --dir website type-check

      - name: Build website
        run: pnpm --dir website build

      - name: Install browser test runtime
        run: pnpm --dir website exec playwright install --with-deps chromium

      - name: Run website browser regressions
        run: pnpm --dir website test:browser

      - name: Upload website browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-browser-evidence
          path: |
            website/playwright-report
            website/test-results
          retention-days: 7

  linux-reflink:
    name: Linux reflink integration (${{ matrix.filesystem }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        filesystem:
          - btrfs
          - xfs

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install filesystem tools
        run: sudo apt-get update && sudo apt-get install --yes btrfs-progs xfsprogs

      - name: Create disposable reflink test volume
        run: |
          truncate --size 2G "$RUNNER_TEMP/riftri-reflink.img"
          mkdir "$RUNNER_TEMP/riftri-reflink"
          if [ "${{ matrix.filesystem }}" = "btrfs" ]; then
            sudo mkfs.btrfs --force "$RUNNER_TEMP/riftri-reflink.img"
          else
            sudo mkfs.xfs -f -m reflink=1 "$RUNNER_TEMP/riftri-reflink.img"
          fi
          sudo mount --options loop "$RUNNER_TEMP/riftri-reflink.img" "$RUNNER_TEMP/riftri-reflink"
          sudo chown "$(id --user):$(id --group)" "$RUNNER_TEMP/riftri-reflink"

      - name: Run Linux reflink integration suite
        env:
          RIFTRI_REQUIRE_REFLINK: "1"
          TMPDIR: ${{ runner.temp }}/riftri-reflink
        run: cargo test --workspace --locked --features riftri-core/native-cow-integration

      - name: Run installed npm workflow on the reflink volume
        env:
          RIFTRI_REQUIRE_INSTALLED_LIFECYCLE: "1"
          TMPDIR: ${{ runner.temp }}/riftri-reflink
        run: npm run smoke:installed

      - name: Record native COW benchmark
        env:
          RIFTRI_BENCHMARK_OUTPUT: ${{ runner.temp }}/riftri-native-cow-${{ matrix.filesystem }}.json
          RIFTRI_REQUIRE_REFLINK: "1"
          TMPDIR: ${{ runner.temp }}/riftri-reflink
        run: >-
          cargo test -p riftri-core
          --features native-cow-integration
          --test native_cow_benchmark
          reports_cold_cached_and_private_write_costs
          -- --ignored --exact --nocapture

      - name: Upload native COW benchmark
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cow-benchmark-linux-${{ matrix.filesystem }}
          path: ${{ runner.temp }}/riftri-native-cow-${{ matrix.filesystem }}.json
          if-no-files-found: error

      - name: Unmount disposable test volume
        if: always()
        run: |
          volume="$RUNNER_TEMP/riftri-reflink"
          mountpoint --quiet "$volume" || exit 0
          if sudo umount "$volume"; then
            exit 0
          fi
          # "target is busy" means something from the test steps outlived them
          # and still holds the volume: TMPDIR points inside it, so any leaked
          # process keeps a working directory or descriptor open here. GitHub's
          # post-job cleanup does list the orphans it kills, but only after this
          # step has already failed, which shows something survived without
          # showing what held the mount (#385). Name the holder while it is
          # still there instead of inferring it afterwards.
          echo "::group::Processes holding $volume"
          echo "-- working directories inside the volume --"
          # Needs no package, so this is the one probe guaranteed to run.
          sudo ls -l /proc/[0-9]*/cwd 2>/dev/null | grep -F "$volume" || echo "(none)"
          if command -v fuser >/dev/null 2>&1; then
            echo "-- fuser --"
            sudo fuser -vm "$volume" 2>&1 || true
          fi
          if command -v lsof >/dev/null 2>&1; then
            echo "-- lsof --"
            sudo lsof +f -- "$volume" 2>&1 || true
          fi
          echo "-- process tree --"
          ps -ef || true
          echo "::endgroup::"
          echo "::error::Could not unmount $volume: still busy. The holder is listed above (#385)."
          exit 1

  linux-overlayfs:
    name: Linux OverlayFS capability integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable unprivileged test namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Create disposable OverlayFS test volume
        run: |
          truncate --size 1G "$RUNNER_TEMP/riftri-overlayfs.img"
          mkdir "$RUNNER_TEMP/riftri-overlayfs"
          mkfs.ext4 -F "$RUNNER_TEMP/riftri-overlayfs.img"
          sudo mount --options loop "$RUNNER_TEMP/riftri-overlayfs.img" "$RUNNER_TEMP/riftri-overlayfs"
          sudo chown "$(id --user):$(id --group)" "$RUNNER_TEMP/riftri-overlayfs"

      - name: Run OverlayFS capability and worktree lifecycle suite
        env:
          RIFTRI_REQUIRE_OVERLAYFS: "1"
          TMPDIR: ${{ runner.temp }}/riftri-overlayfs
        run: |
          if unshare --user --map-root-user --mount --propagation private \
            sh -c 'cargo test -p riftri-storage --test linux_overlayfs -- --nocapture &&
              cargo test -p riftri-core --features native-cow-integration \
                --test linux_overlayfs_worktree -- --nocapture &&
              cargo test -p riftri-core --features native-cow-integration --lib \
                overlayfs_ -- --nocapture --test-threads=1 &&
              cargo test -p riftri-cli --test linux_cli \
                overlayfs_ -- --nocapture --test-threads=1'; then
            exit 0
          fi
          sudo dmesg | grep --ignore-case overlay | tail --lines=50 || true
          exit 1

      - name: Install the narrow OverlayFS helper
        run: |
          cargo build --locked -p riftri-cli
          sudo target/debug/riftri overlayfs install-helper --replace

      - name: Run ordinary-shell OverlayFS helper lifecycle
        env:
          RIFTRI_REQUIRE_OVERLAYFS_HELPER: "1"
          TMPDIR: ${{ runner.temp }}/riftri-overlayfs
        run: >-
          cargo test -p riftri-cli --test linux_cli
          installed_helper_manages_overlayfs_from_an_ordinary_shell
          -- --exact --nocapture

      - name: Run installed npm workflow through the OverlayFS helper
        env:
          RIFTRI_REQUIRE_INSTALLED_LIFECYCLE: "1"
          TMPDIR: ${{ runner.temp }}/riftri-overlayfs
        run: npm run smoke:installed

      - name: Record native COW benchmark through the OverlayFS helper
        env:
          RIFTRI_BENCHMARK_OUTPUT: ${{ runner.temp }}/riftri-native-cow-overlayfs.json
          RIFTRI_REQUIRE_OVERLAYFS_HELPER: "1"
          TMPDIR: ${{ runner.temp }}/riftri-overlayfs
        run: >-
          cargo test -p riftri-core
          --features native-cow-integration
          --test native_cow_benchmark
          reports_cold_cached_and_private_write_costs
          -- --ignored --exact --nocapture

      - name: Upload native COW benchmark
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cow-benchmark-linux-overlayfs
          path: ${{ runner.temp }}/riftri-native-cow-overlayfs.json
          if-no-files-found: error

      - name: Unmount disposable test volume
        if: always()
        run: |
          volume="$RUNNER_TEMP/riftri-overlayfs"
          mountpoint --quiet "$volume" || exit 0
          if sudo umount "$volume"; then
            exit 0
          fi
          # "target is busy" means something from the test steps outlived them
          # and still holds the volume: TMPDIR points inside it, so any leaked
          # process keeps a working directory or descriptor open here. GitHub's
          # post-job cleanup does list the orphans it kills, but only after this
          # step has already failed, which shows something survived without
          # showing what held the mount (#385). Name the holder while it is
          # still there instead of inferring it afterwards.
          echo "::group::Processes holding $volume"
          echo "-- working directories inside the volume --"
          # Needs no package, so this is the one probe guaranteed to run.
          sudo ls -l /proc/[0-9]*/cwd 2>/dev/null | grep -F "$volume" || echo "(none)"
          if command -v fuser >/dev/null 2>&1; then
            echo "-- fuser --"
            sudo fuser -vm "$volume" 2>&1 || true
          fi
          if command -v lsof >/dev/null 2>&1; then
            echo "-- lsof --"
            sudo lsof +f -- "$volume" 2>&1 || true
          fi
          echo "-- process tree --"
          ps -ef || true
          echo "::endgroup::"
          echo "::error::Could not unmount $volume: still busy. The holder is listed above (#385)."
          exit 1

  windows-refs:
    name: Windows ReFS block-clone integration
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Create disposable ReFS test volume
        shell: pwsh
        run: |
          $vhdPath = Join-Path $env:RUNNER_TEMP "riftri-refs.vhdx"
          $scriptPath = Join-Path $env:RUNNER_TEMP "riftri-refs-create.txt"
          @"
          create vdisk file="$vhdPath" maximum=4096 type=expandable
          select vdisk file="$vhdPath"
          attach vdisk
          create partition primary
          format fs=refs quick label=Riftri
          assign letter=R
          exit
          "@ | Set-Content -Path $scriptPath -Encoding ascii
          diskpart.exe /s $scriptPath
          if ($LASTEXITCODE -ne 0) {
            throw "diskpart failed with exit code $LASTEXITCODE"
          }
          $volume = Get-Volume -DriveLetter R
          if ($volume.FileSystem -ne "ReFS") {
            throw "expected ReFS test volume, found $($volume.FileSystem)"
          }
          New-Item -ItemType Directory -Path "R:\riftri-temp" | Out-Null

      - name: Run Windows ReFS integration suite
        shell: pwsh
        env:
          RIFTRI_REQUIRE_REFS: "1"
          TEMP: R:\riftri-temp
          TMP: R:\riftri-temp
        run: cargo test --workspace --locked --features riftri-core/native-cow-integration

      - name: Run installed npm workflow on ReFS
        shell: pwsh
        env:
          RIFTRI_REQUIRE_INSTALLED_LIFECYCLE: "1"
          TEMP: R:\riftri-temp
          TMP: R:\riftri-temp
        run: npm run smoke:installed

      - name: Record native COW benchmark
        shell: pwsh
        env:
          RIFTRI_BENCHMARK_OUTPUT: ${{ runner.temp }}\riftri-native-cow-refs.json
          RIFTRI_REQUIRE_REFS: "1"
          TEMP: R:\riftri-temp
          TMP: R:\riftri-temp
        run: >-
          cargo test -p riftri-core
          --features native-cow-integration
          --test native_cow_benchmark
          reports_cold_cached_and_private_write_costs
          -- --ignored --exact --nocapture

      - name: Upload native COW benchmark
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cow-benchmark-windows-refs
          path: ${{ runner.temp }}\riftri-native-cow-refs.json
          if-no-files-found: error

      - name: Detach disposable ReFS test volume
        if: always()
        shell: pwsh
        run: |
          $vhdPath = Join-Path $env:RUNNER_TEMP "riftri-refs.vhdx"
          if (Test-Path $vhdPath) {
            $scriptPath = Join-Path $env:RUNNER_TEMP "riftri-refs-detach.txt"
            @(
              "select vdisk file=`"$vhdPath`""
              "detach vdisk"
              "exit"
            ) | Set-Content -Path $scriptPath -Encoding ascii
            diskpart.exe /s $scriptPath
          }
