name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust quality components
        run: rustup component add clippy rustfmt

      - name: Install npm metadata only
        run: npm ci --ignore-scripts --omit=optional

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run npm launcher tests
        run: npm test

      - name: Inspect npm package contents
        run: npm run pack:check

  website:
    name: Website
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.18.3 --activate

      - name: Install website dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Check website types
        run: pnpm --dir website type-check

      - name: Build website
        run: pnpm --dir website build

  linux-reflink:
    name: Linux reflink integration (${{ matrix.filesystem }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        filesystem:
          - btrfs
          - xfs

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install filesystem tools
        run: sudo apt-get update && sudo apt-get install --yes btrfs-progs xfsprogs

      - name: Create disposable reflink test volume
        run: |
          truncate --size 2G "$RUNNER_TEMP/riftri-reflink.img"
          mkdir "$RUNNER_TEMP/riftri-reflink"
          if [ "${{ matrix.filesystem }}" = "btrfs" ]; then
            sudo mkfs.btrfs --force "$RUNNER_TEMP/riftri-reflink.img"
          else
            sudo mkfs.xfs -f -m reflink=1 "$RUNNER_TEMP/riftri-reflink.img"
          fi
          sudo mount --options loop "$RUNNER_TEMP/riftri-reflink.img" "$RUNNER_TEMP/riftri-reflink"
          sudo chown "$(id --user):$(id --group)" "$RUNNER_TEMP/riftri-reflink"

      - name: Run Linux reflink integration suite
        env:
          RIFTRI_REQUIRE_REFLINK: "1"
          TMPDIR: ${{ runner.temp }}/riftri-reflink
        run: cargo test --workspace --features riftri-core/native-cow-integration

      - name: Verify cached-view physical allocation
        env:
          RIFTRI_REQUIRE_REFLINK: "1"
          TMPDIR: ${{ runner.temp }}/riftri-reflink
        run: >-
          cargo test -p riftri-core
          --features native-cow-integration
          --test native_cow_worktree
          cached_view_uses_materially_less_physical_space_than_its_logical_size
          -- --ignored --exact --nocapture

      - name: Unmount disposable test volume
        if: always()
        run: |
          if mountpoint --quiet "$RUNNER_TEMP/riftri-reflink"; then
            sudo umount "$RUNNER_TEMP/riftri-reflink"
          fi

  windows-refs:
    name: Windows ReFS block-clone integration
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create disposable ReFS test volume
        shell: pwsh
        run: |
          $vhdPath = Join-Path $env:RUNNER_TEMP "riftri-refs.vhdx"
          $scriptPath = Join-Path $env:RUNNER_TEMP "riftri-refs-create.txt"
          @"
          create vdisk file="$vhdPath" maximum=4096 type=expandable
          select vdisk file="$vhdPath"
          attach vdisk
          create partition primary
          format fs=refs quick label=Riftri
          assign letter=R
          exit
          "@ | Set-Content -Path $scriptPath -Encoding ascii
          diskpart.exe /s $scriptPath
          if ($LASTEXITCODE -ne 0) {
            throw "diskpart failed with exit code $LASTEXITCODE"
          }
          $volume = Get-Volume -DriveLetter R
          if ($volume.FileSystem -ne "ReFS") {
            throw "expected ReFS test volume, found $($volume.FileSystem)"
          }
          New-Item -ItemType Directory -Path "R:\riftri-temp" | Out-Null

      - name: Run Windows ReFS integration suite
        shell: pwsh
        env:
          RIFTRI_REQUIRE_REFS: "1"
          TEMP: R:\riftri-temp
          TMP: R:\riftri-temp
        run: cargo test --workspace --features riftri-core/native-cow-integration

      - name: Verify cached-view physical allocation
        shell: pwsh
        env:
          RIFTRI_REQUIRE_REFS: "1"
          TEMP: R:\riftri-temp
          TMP: R:\riftri-temp
        run: >-
          cargo test -p riftri-core
          --features native-cow-integration
          --test native_cow_worktree
          cached_view_uses_materially_less_physical_space_than_its_logical_size
          -- --ignored --exact --nocapture

      - name: Detach disposable ReFS test volume
        if: always()
        shell: pwsh
        run: |
          $vhdPath = Join-Path $env:RUNNER_TEMP "riftri-refs.vhdx"
          if (Test-Path $vhdPath) {
            $scriptPath = Join-Path $env:RUNNER_TEMP "riftri-refs-detach.txt"
            @(
              "select vdisk file=`"$vhdPath`""
              "detach vdisk"
              "exit"
            ) | Set-Content -Path $scriptPath -Encoding ascii
            diskpart.exe /s $scriptPath
          }
