name: Links

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/links.yml"
      - "lychee.toml"
  schedule:
    # Weekly sweep of main so external link rot is caught between doc changes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-links:
    name: Check Markdown links
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          # Authenticated github.com checks avoid anonymous rate limits and
          # validate repository blob links like the one that went stale in #118.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config lychee.toml --no-progress --verbose './**/*.md'
          fail: true
