name: Release

# Temporary diagnostic for npm trusted publishing. npm matches the trust
# policy against this file name, so the diagnostic has to live in
# `release.yml`. It publishes nothing and never prints a token.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oidc-diagnostic:
    name: Diagnose npm OIDC exchange
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Show npm version and non-secret OIDC claims
        run: |
          npm --version
          id_token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)"
          echo "::add-mask::$id_token"
          payload="$(printf '%s' "$id_token" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d | jq '{aud, iss, repository, repository_owner, workflow_ref, job_workflow_ref, ref, ref_type, event_name, environment, runner_environment}'

      - name: Exchange the OIDC token directly (status and error body only)
        run: |
          id_token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)"
          echo "::add-mask::$id_token"
          for name in riftri-darwin-arm64 riftri; do
            status="$(curl -sS -o response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $id_token" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$name")"
            echo "$name: HTTP $status"
            if [ "${status#2}" = "$status" ]; then cat response.json; echo; fi
            rm -f response.json
          done

      - name: Dry-run publish with verbose npm logs
        working-directory: package/platforms/riftri-darwin-arm64
        run: npm publish --dry-run --access public --tag latest --loglevel verbose 2>&1 | grep -iE "oidc|token|auth|exchange|provenance|npm verbose (cli|title)" || true
