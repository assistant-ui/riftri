name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            package: riftri-darwin-arm64
            executable: riftri
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package: riftri-darwin-x64
            executable: riftri
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: riftri-linux-arm64-gnu
            executable: riftri
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            package: riftri-linux-arm64-musl
            executable: riftri
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: riftri-linux-x64-gnu
            executable: riftri
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            package: riftri-linux-x64-musl
            executable: riftri
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            package: riftri-win32-arm64
            executable: riftri.exe
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            package: riftri-win32-x64
            executable: riftri.exe

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl linker
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p riftri-cli

      - name: Smoke-test native binary
        shell: bash
        run: '"target/${{ matrix.target }}/release/${{ matrix.executable }}" --version'

      - name: Upload native binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}
          path: target/${{ matrix.target }}/release/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 2

  stage:
    name: Stage and inspect release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download native binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: riftri-*
          path: artifacts

      - name: Install npm metadata only
        run: npm ci --ignore-scripts --omit=optional

      - name: Validate package versions
        run: npm run check:packages

      - name: Select release version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="v$(node -p "require('./package.json').version")"
          fi
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "Staging ${release_tag} for ${GITHUB_EVENT_NAME}"

      - name: Stage npm packages and GitHub assets
        run: node package/scripts/prepare-release.mjs "${RELEASE_TAG}" artifacts

      - name: Verify GitHub release checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS

      - name: Upload GitHub release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

      - name: Inspect all npm tarballs
        shell: bash
        run: |
          mkdir -p dist/npm
          for package_directory in package/platforms/*; do
            npm pack "${package_directory}" --pack-destination dist/npm
          done
          npm pack ./dist/npm-root --pack-destination dist/npm

      - name: Confirm non-publishing rehearsal
        if: github.event_name == 'workflow_dispatch'
        run: echo "Release rehearsal completed without publishing npm packages or a GitHub release."

  publish:
    name: Publish npm packages
    # Enable only after npm resolves the documented package-name security rejection.
    if: github.event_name == 'push' && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download native binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: riftri-*
          path: artifacts

      - name: Install npm metadata only
        run: npm ci --ignore-scripts --omit=optional

      - name: Validate package versions
        run: npm run check:packages

      - name: Stage npm packages and GitHub assets
        run: node package/scripts/prepare-release.mjs "${GITHUB_REF_NAME}" artifacts

      - name: Verify GitHub release checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS

      - name: Configure bootstrap npm token when present
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          else
            echo "Using npm trusted publishing"
          fi

      - name: Publish npm packages
        run: node package/scripts/publish-packages.mjs

  github-release:
    name: Publish direct downloads
    if: github.event_name == 'push'
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download inspected GitHub release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-release-assets
          path: dist/release

      - name: Verify exact GitHub release assets
        working-directory: dist/release
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { lstatSync, readFileSync, readdirSync } = require('node:fs');
          const tag = process.env.GITHUB_REF_NAME;
          assert.match(tag, /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          const archives = [
            'riftri-darwin-arm64', 'riftri-darwin-x64',
            'riftri-linux-arm64-gnu', 'riftri-linux-arm64-musl',
            'riftri-linux-x64-gnu', 'riftri-linux-x64-musl',
            'riftri-win32-arm64', 'riftri-win32-x64',
          ].map(name => `${name}-${tag}.tar.gz`).sort();
          const expected = ['SHA256SUMS', ...archives].sort();
          assert.deepEqual(readdirSync('.').sort(), expected, 'unexpected release asset set');
          for (const name of expected) {
            assert.ok(lstatSync(name).isFile(), `${name} is not a regular file`);
          }
          const checksums = readFileSync('SHA256SUMS', 'utf8').trimEnd().split('\n');
          assert.equal(checksums.length, archives.length, 'expected one checksum per archive');
          const verified = [];
          for (const line of checksums) {
            const match = /^([0-9a-f]{64})  ([^/\\]+)$/.exec(line);
            assert.ok(match, 'invalid checksum line');
            const [, checksum, name] = match;
            assert.ok(archives.includes(name), `unexpected checksum target: ${name}`);
            assert.equal(createHash('sha256').update(readFileSync(name)).digest('hex'), checksum,
              `checksum mismatch: ${name}`);
            verified.push(name);
          }
          assert.deepEqual(verified.sort(), archives, 'missing or duplicate archive checksum');
          console.log(`Verified all ${archives.length} native archives for ${tag}`);
          NODE

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_options=(--verify-tag --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          # An existing release fails safely: never replace published assets.
          gh release create "${GITHUB_REF_NAME}" dist/release/SHA256SUMS dist/release/*.tar.gz "${release_options[@]}"
