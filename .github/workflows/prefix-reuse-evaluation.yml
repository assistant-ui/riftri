name: Prefix reuse evaluation

on:
  push:
    branches: [perf/checkout-prefix-reuse]

permissions:
  contents: read

jobs:
  quality:
    name: Prefix safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  screen:
    name: Isolated prefix phase screen
    runs-on: macos-15
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: assistant-ui/assistant-ui
          ref: 038cd9f82b418afe9e6d0080648738f78586fbca
          path: reference
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check exact scanner sources, then retain every timing pair
        timeout-minutes: 14
        run: node candidate/docs/benchmarks/prefix-reuse.mjs candidate "$RUNNER_TEMP/prefix-screen" "$GITHUB_WORKSPACE/reference"
      - name: Retain source, compiler, correctness and timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prefix-phase-screen
          path: |
            ${{ runner.temp }}/prefix-screen/results.json
            ${{ runner.temp }}/prefix-screen/screen.rs
            ${{ runner.temp }}/prefix-screen/*.paths
            ${{ runner.temp }}/prefix-screen/*.log
          if-no-files-found: error
