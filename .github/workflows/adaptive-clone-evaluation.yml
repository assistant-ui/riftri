name: Adaptive APFS evaluation

on:
  pull_request:

permissions:
  contents: read

# Temporary research job: remove after retaining its terminal results. The
# rejected runtime exists only in the checksummed patch, never in this checkout.
jobs:
  replication:
    if: github.head_ref == 'perf/adaptive-apfs-clones'
    name: Adaptive clone comparison (${{ matrix.replica }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    env:
      RIFTRI_BENCH_STAGE_DIAGNOSTICS: "0"
      CARGO_BUILD_JOBS: "3"
    steps:
      - name: Check out evaluation sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check out fixed baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a58006d7c7b4989a055a967e65d5654281b77ea4
          path: benchmark-baseline
          persist-credentials: false

      - name: Check out isolated prototype build source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a58006d7c7b4989a055a967e65d5654281b77ea4
          path: benchmark-candidate
          persist-credentials: false

      - name: Check out pinned reference as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: assistant-ui/assistant-ui
          ref: 038cd9f82b418afe9e6d0080648738f78586fbca
          path: benchmark-reference
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify and reconstruct exact prototype
        run: |
          node docs/benchmarks/adaptive-evaluation-ci.mjs prepare "$RUNNER_TEMP/adaptive-tools"
          git -C benchmark-candidate apply --check "$RUNNER_TEMP/adaptive-tools/prototype.patch"
          git -C benchmark-candidate apply "$RUNNER_TEMP/adaptive-tools/prototype.patch"
          git -C benchmark-candidate add --intent-to-add crates/riftri-storage/src/apfs/clone_admission.rs
          actual_patch=$(git -C benchmark-candidate diff --binary | shasum -a 256 | cut -d ' ' -f 1)
          test "$actual_patch" = bad2251b5708114f5302bc3c2e1253f2469fb572e59401543ffe99abab192660
          node --test "$RUNNER_TEMP/adaptive-tools/adaptive-evaluation.test.mjs" docs/benchmarks/apfs-calibration-gate.test.mjs

      - name: Verify prototype quality and build before timing
        run: |
          rustup component add clippy rustfmt
          cargo fmt --manifest-path benchmark-candidate/Cargo.toml --all --check
          cargo clippy --manifest-path benchmark-candidate/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path benchmark-candidate/Cargo.toml --workspace --locked
          cargo build --release --locked -p riftri-cli --manifest-path benchmark-baseline/Cargo.toml
          cargo build --release --locked -p riftri-cli --manifest-path benchmark-candidate/Cargo.toml
          node docs/benchmarks/adaptive-evaluation-ci.mjs identity "$RUNNER_TEMP/adaptive-identity.json" \
            "$GITHUB_WORKSPACE/benchmark-baseline/target/release/riftri" \
            "$GITHUB_WORKSPACE/benchmark-candidate/target/release/riftri"

      - name: Create isolated APFS volume
        id: volume
        run: |
          hdiutil create -size 4g -fs APFS -volname RiftriAdaptiveClones \
            -type SPARSEBUNDLE "$RUNNER_TEMP/adaptive-clones"
          mkdir "$RUNNER_TEMP/adaptive-volume"
          hdiutil attach "$RUNNER_TEMP/adaptive-clones.sparsebundle" \
            -mountpoint "$RUNNER_TEMP/adaptive-volume" -nobrowse
          touch "$RUNNER_TEMP/adaptive-volume/.metadata_never_index"

      # Stop after any operational failure; never overlap a later benchmark
      # with uncertain cleanup. Missing cases remain failures, not successes.
      - name: Same-binary synthetic serial control
        id: control_synthetic
        if: ${{ !cancelled() && steps.volume.outcome == 'success' }}
        timeout-minutes: 8
        run: >-
          node "$RUNNER_TEMP/adaptive-tools/docs/benchmarks/apfs-read-ahead.mjs"
          "$GITHUB_WORKSPACE/benchmark-baseline/target/release/riftri"
          "$RUNNER_TEMP/adaptive-volume/calibration-serial" 4096 8
          "$GITHUB_WORKSPACE/benchmark-baseline/target/release/riftri" 8192 - 1

      - name: Same-binary reference serial control
        id: control_reference
        if: ${{ !cancelled() && steps.control_synthetic.outcome == 'success' }}
        timeout-minutes: 8
        run: >-
          node "$RUNNER_TEMP/adaptive-tools/docs/benchmarks/apfs-read-ahead.mjs"
          "$GITHUB_WORKSPACE/benchmark-baseline/target/release/riftri"
          "$RUNNER_TEMP/adaptive-volume/calibration-reference-serial" 4096 8
          "$GITHUB_WORKSPACE/benchmark-baseline/target/release/riftri" 8192 "$GITHUB_WORKSPACE/benchmark-reference" 1

      - name: Synthetic serial
        id: synthetic_serial
        if: ${{ !cancelled() && steps.control_reference.outcome == 'success' }}
        timeout-minutes: 8
        run: >-
          node "$RUNNER_TEMP/adaptive-tools/docs/benchmarks/apfs-read-ahead.mjs"
          "$GITHUB_WORKSPACE/benchmark-baseline/target/release/riftri"
          "$RUNNER_TEMP/adaptive-volume/serial-many" 4096 8
          "$GITHUB_WORKSPACE/benchmark-candidate/target/release/riftri" 8192 - 1

      - name: Synthetic four-way
        id: synthetic_four
        if: ${{ !cancelled() && steps.synthetic_serial.outcome == 'success' }}
        timeout-minutes: 8
        run: >-
          node "$RUNNER_TEMP/adaptive-tools/docs/benchmarks/apfs-read-ahead.mjs"
          "$GITHUB_WORKSPACE/benchmark-baseline/target/release/riftri"
          "$RUNNER_TEMP/adaptive-volume/concurrent-four" 4096 8
          "$GITHUB_WORKSPACE/benchmark-candidate/target/release/riftri" 8192 - 4

      - name: Reference serial
        id: reference_serial
        if: ${{ !cancelled() && steps.synthetic_four.outcome == 'success' }}
        timeout-minutes: 8
        run: >-
          node "$RUNNER_TEMP/adaptive-tools/docs/benchmarks/apfs-read-ahead.mjs"
          "$GITHUB_WORKSPACE/benchmark-baseline/target/release/riftri"
          "$RUNNER_TEMP/adaptive-volume/reference-serial" 4096 8
          "$GITHUB_WORKSPACE/benchmark-candidate/target/release/riftri" 8192 "$GITHUB_WORKSPACE/benchmark-reference" 1

      - name: Reference four-way
        if: ${{ !cancelled() && steps.reference_serial.outcome == 'success' }}
        timeout-minutes: 8
        run: >-
          node "$RUNNER_TEMP/adaptive-tools/docs/benchmarks/apfs-read-ahead.mjs"
          "$GITHUB_WORKSPACE/benchmark-baseline/target/release/riftri"
          "$RUNNER_TEMP/adaptive-volume/reference-four" 4096 8
          "$GITHUB_WORKSPACE/benchmark-candidate/target/release/riftri" 8192 "$GITHUB_WORKSPACE/benchmark-reference" 4

      - name: Evaluate every fixture independently
        if: ${{ !cancelled() && steps.volume.outcome == 'success' }}
        run: >-
          node docs/benchmarks/adaptive-evaluation-ci.mjs evaluate
          "$RUNNER_TEMP/adaptive-volume" "$RUNNER_TEMP/adaptive-tools"
          "$RUNNER_TEMP/adaptive-identity.json" "$RUNNER_TEMP/adaptive-evaluation.json"

      - name: Retain results, traces, logs, and journals
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adaptive-apfs-replication-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/adaptive-identity.json
            ${{ runner.temp }}/adaptive-evaluation.json
            ${{ runner.temp }}/adaptive-volume/*/results.json
            ${{ runner.temp }}/adaptive-volume/*/git-*.jsonl
            ${{ runner.temp }}/adaptive-volume/*/add-*.log
            ${{ runner.temp }}/adaptive-volume/*/state/operations/*.json
          if-no-files-found: error

      - name: Detach exact test image without forcing
        if: always()
        run: |
          image="$RUNNER_TEMP/adaptive-clones.sparsebundle"
          attached_device() {
            hdiutil info | awk -v img="$image" '
              $1 == "image-path" { found = ($3 == img) }
              found && $1 ~ /^\/dev\/disk[0-9]+$/ { print $1; exit }'
          }
          for attempt in 1 2 3 4 5; do
            device=$(attached_device)
            if [ -z "$device" ]; then exit 0; fi
            if hdiutil detach "$device"; then exit 0; fi
            sleep "$attempt"
          done
          hdiutil info
          exit 1
