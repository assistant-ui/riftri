name: APFS location controls

on:
  pull_request:

permissions:
  contents: read

# Temporary diagnostic, removed once terminal evidence is retained. Both
# labels run the same unchanged executable; this cannot accept an optimization.
jobs:
  controls:
    if: github.head_ref == 'test/apfs-location-controls'
    name: Same-binary APFS controls (${{ matrix.order }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        order: [forward, reverse]
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - name: Check out diagnostic sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check out fixed production baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a58006d7c7b4989a055a967e65d5654281b77ea4
          path: benchmark-baseline
          persist-credentials: false

      - name: Check out pinned reference as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: assistant-ui/assistant-ui
          ref: 038cd9f82b418afe9e6d0080648738f78586fbca
          path: benchmark-reference
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Test controls and build unchanged baseline before timing
        run: |
          node --test docs/benchmarks/apfs-calibration-gate.test.mjs docs/benchmarks/apfs-location-controls.test.mjs
          cargo build --release --locked -p riftri-cli --manifest-path benchmark-baseline/Cargo.toml
          git -C benchmark-baseline diff --exit-code
          git -C benchmark-baseline rev-parse HEAD > "$RUNNER_TEMP/location-baseline-commit.txt"
          shasum -a 256 benchmark-baseline/target/release/riftri > "$RUNNER_TEMP/location-binary-sha256.txt"
          sw_vers > "$RUNNER_TEMP/location-system.txt"
          uname -a >> "$RUNNER_TEMP/location-system.txt"
          sysctl hw.memsize hw.ncpu >> "$RUNNER_TEMP/location-system.txt"
          git --version >> "$RUNNER_TEMP/location-system.txt"
          node --version >> "$RUNNER_TEMP/location-system.txt"
          rustc --version >> "$RUNNER_TEMP/location-system.txt"

      - name: Create fresh host and disk-image fixture roots
        run: |
          node -e 'const s=require("node:fs").statfsSync(process.env.RUNNER_TEMP); const free=s.bavail*s.bsize; console.log({availableBytes:free}); if(free<8*1024**3) throw Error("at least 8 GiB free required before controls")'
          hdiutil create -size 4g -fs APFS -volname RiftriLocationControls \
            -type SPARSEBUNDLE "$RUNNER_TEMP/location-disk"
          mkdir "$RUNNER_TEMP/location-volume" "$RUNNER_TEMP/location-host"
          hdiutil attach "$RUNNER_TEMP/location-disk.sparsebundle" \
            -mountpoint "$RUNNER_TEMP/location-volume" -nobrowse
          touch "$RUNNER_TEMP/location-volume/.metadata_never_index"
          mkdir "$RUNNER_TEMP/location-volume/fixtures"

      - name: Run eight non-overlapping full-verification controls
        timeout-minutes: 35
        env:
          CASE_ORDER: ${{ matrix.order }}
        run: >-
          node docs/benchmarks/apfs-location-controls.mjs
          "$GITHUB_WORKSPACE/benchmark-baseline/target/release/riftri"
          "$RUNNER_TEMP/location-host" "$RUNNER_TEMP/location-volume/fixtures"
          "$GITHUB_WORKSPACE/benchmark-reference" "$RUNNER_TEMP/location-disk.sparsebundle"
          "$RUNNER_TEMP/location-report" "$CASE_ORDER"

      - name: Retain every result, trace, log and remaining operation journal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apfs-location-controls-${{ matrix.order }}
          path: |
            ${{ runner.temp }}/location-baseline-commit.txt
            ${{ runner.temp }}/location-binary-sha256.txt
            ${{ runner.temp }}/location-system.txt
            ${{ runner.temp }}/location-report
            ${{ runner.temp }}/location-host/*/results.json
            ${{ runner.temp }}/location-host/*/git-*.jsonl
            ${{ runner.temp }}/location-host/*/add-*.log
            ${{ runner.temp }}/location-host/*/state/operations/*.json
            ${{ runner.temp }}/location-volume/fixtures/*/results.json
            ${{ runner.temp }}/location-volume/fixtures/*/git-*.jsonl
            ${{ runner.temp }}/location-volume/fixtures/*/add-*.log
            ${{ runner.temp }}/location-volume/fixtures/*/state/operations/*.json
          if-no-files-found: error

      - name: Detach exact test image without forcing
        if: always()
        run: |
          image="$RUNNER_TEMP/location-disk.sparsebundle"
          attached_device() {
            hdiutil info | awk -v img="$image" '
              $1 == "image-path" { found = ($3 == img) }
              found && $1 ~ /^\/dev\/disk[0-9]+$/ { print $1; exit }'
          }
          for attempt in 1 2 3 4 5; do
            device=$(attached_device)
            if [ -z "$device" ]; then exit 0; fi
            if hdiutil detach "$device"; then exit 0; fi
            sleep "$attempt"
          done
          hdiutil info
          exit 1
