version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-launcher-dependencies:
        patterns: ["*"]
    ignore:
      # The client contract test drives the TypeScript compiler API, which
      # TypeScript 7 no longer ships.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node types track the oldest supported Node (engines: >=18.18), so a
      # newer major would let the contract use APIs that Node lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website-dependencies:
        patterns: ["*"]
