# Configuration for the Markdown link checker (https://lychee.cli.rs),
# run by .github/workflows/links.yml.

max_retries = 3
timeout = 30

# 429 means the host rate-limited the checker, not that the link is broken.
accept = ["200..=299", "429"]

# Private/local hosts appear in examples, not as links readers can follow.
# (Email addresses are already excluded by default.)
exclude_all_private = true

exclude = [
  # Placeholder URLs used in documentation examples.
  "^https://raw\\.githubusercontent\\.com/assistant-ui/riftri/<full-commit-id>/",
  # Links into this repository at `main`. Checking these over HTTP deadlocks
  # every pull request that adds a document: the dual-index convention requires
  # linking it from website/public/index.md, but that URL only resolves after
  # the merge. They are already covered more strictly by the guard test in
  # package/test/website-markdown.test.js, which resolves each link against the
  # working tree and fails if any document is missing from the index. Pinned
  # links to a commit or tag stay checked, since those never move.
  "^https://github\\.com/assistant-ui/riftri/blob/main/",
]

exclude_path = ["node_modules", "website/node_modules", "target"]
